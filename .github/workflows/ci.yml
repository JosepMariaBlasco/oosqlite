name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    env:
      # ooRexx revision: main/trunk of ooRexx's Subversion repository, built
      # here (scripts/oorexx-source.sh, scripts/oorexx-build.sh) and cached,
      # since SourceForge has no 5.3.0 beta builds of it.  Sessions and the
      # platforms workflow read it from here too.  (With SourceForge's .deb,
      # scripts/setup-oorexx.sh installs the same revision.)
      OOREXX_REV: "13550"
    steps:
      - uses: actions/checkout@v5

      - name: Restore ooRexx
        id: oorexx
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/oorexx
          key: oorexx-r${{ env.OOREXX_REV }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/oorexx-*.sh') }}

      - name: Build ooRexx from Subversion
        if: steps.oorexx.outputs.cache-hit != 'true'
        run: |
          command -v svn >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq subversion; }
          scripts/oorexx-source.sh "$RUNNER_TEMP/oorexx-src"
          scripts/oorexx-build.sh "$RUNNER_TEMP/oorexx-src" "$RUNNER_TEMP/oorexx"

      - name: Use ooRexx
        run: |
          home="$RUNNER_TEMP/oorexx"
          echo "$home/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$home/lib" >> "$GITHUB_ENV"
          echo "CPATH=$home/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$home/lib" >> "$GITHUB_ENV"
          LD_LIBRARY_PATH="$home/lib" "$home/bin/rexx" -v

      - name: Build
        run: make -f Makefile.lin lib -j"$(nproc)"

      - name: Build the extension libraries used by the tests
        run: make -f Makefile.lin example_dlls

      - name: Test
        working-directory: tests
        run: |
          export LD_LIBRARY_PATH="$PWD/../bin/linux:$LD_LIBRARY_PATH"
          export REXX_PATH="$PWD/framework:$PWD/../bin/linux"
          # Lets the tests of section C13 force their race (tests/ooSQLite.testGroup)
          export OOSQLITE_TEST_HOOKS=1
          rexx ooSQLite.testGroup 2>&1 | tee test-output.txt
          # The test group exits with 0 even when tests fail, so the summary
          # decides.  If the process crashes there is no summary and this fails.
          grep -Eq '^Tests ran: +[1-9]' test-output.txt
          grep -Eq '^Failures: +0$' test-output.txt
          grep -Eq '^Errors: +0$' test-output.txt
