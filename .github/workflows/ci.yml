name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    env:
      # ooRexx revision (SourceForge's 5.3.0 beta builds).  Sessions read it
      # from here too: scripts/setup-oorexx.sh.
      OOREXX_REV: "13324"
    steps:
      - uses: actions/checkout@v5

      - name: Install ooRexx
        run: sudo TMPDIR="$RUNNER_TEMP" scripts/setup-oorexx.sh

      - name: Build
        run: make -f Makefile.lin lib -j"$(nproc)"

      - name: Build the extension libraries used by the tests
        run: make -f Makefile.lin example_dlls

      - name: Test
        working-directory: tests
        run: |
          export LD_LIBRARY_PATH="$PWD/../bin/linux"
          export REXX_PATH="$PWD/framework:$PWD/../bin/linux"
          # Lets the tests of section C13 force their race (tests/ooSQLite.testGroup)
          export OOSQLITE_TEST_HOOKS=1
          rexx ooSQLite.testGroup 2>&1 | tee test-output.txt
          # The test group exits with 0 even when tests fail, so the summary
          # decides.  If the process crashes there is no summary and this fails.
          grep -Eq '^Tests ran: +[1-9]' test-output.txt
          grep -Eq '^Failures: +0$' test-output.txt
          grep -Eq '^Errors: +0$' test-output.txt
